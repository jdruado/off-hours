<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Shop | Everyday Comfort Tee | Off/Hours</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <link href="./styles/custom-style.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    </head>
    
    <body class="d-flex flex-column min-vh-100"  data-bs-theme="light">
        <nav class="navbar md:navbar-expand bg-1 border-bottom">
            <div class="container">
                <a class="navbar-brand" href="index.html">OFF/HOURS<span class="brand-dot" style="background-color: var(--bs-primary-base);"></span></a>

                <button class="btn-icon navbar-toggler" type="button"
                        data-bs-toggle="drawer" data-bs-target="#mainNav"
                        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>

                <dialog class="drawer drawer-end" tabindex="-1" id="mainNav" aria-labelledby="mainNavLabel">
                    <div class="drawer-header">
                        <h5 class="drawer-title" id="mainNavLabel">Menu</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>

                    <div class="drawer-body">
                        <ul class="navbar-nav md:ms-auto">
                            <li class="nav-item"><a class="nav-link" href="./index.html">Home</a></li>
                            <li class="nav-item"><a class="nav-link active" aria-current="page" href="./index.html#products">Shop</a></li>
                            <li class="nav-item"><a class="nav-link" href="./index.html#about">About</a></li>
                            <li class="nav-item"><a class="nav-link" href="./contact.html">Contact</a></li>
                        </ul>
                    </div>
                </dialog>
            </div>
        </nav>
        
        <main class="container py-12">
            <div class="row justify-content-center">
                <div class="md:col-6">
                    <div id="productCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
                        <div class="carousel-inner rounded">
                            <div class="carousel-item">
                                <img src="./media/placeholder-white.jpg" class="d-block w-50 mx-auto" alt="Don't Be Late Tee - White">
                            </div>

                            <div class="carousel-item">
                                <img src="./media/placeholder-black.jpg" class="d-block w-50 mx-auto" alt="Don't Be Late Tee - Black">
                            </div>

                            <div class="carousel-item">
                                <img src="./media/placeholder-gray.jpg" class="d-block w-50 mx-auto" alt="Don't Be Late Tee - Gray">
                            </div>
                        </div>
                        
                        <div class="d-flex gap-2 justify-content-center mt-3">
                            <button class="btn btn-sm rounded-circle d-flex align-items-center justify-content-center carousel-nav-btn" 
                                    type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
                                <span>&larr;</span>
                            </button>

                            <button class="btn btn-sm rounded-circle d-flex align-items-center justify-content-center carousel-nav-btn" 
                                    type="button" data-bs-target="#productCarousel" data-bs-slide="next">
                                <span>&rarr;</span>
                            </button>
                        </div>
                    </div>

                    <h1 id="product-title" class="mb-5">Everyday Comfort Tee</h1>
                    <p id="product-price">₱499</p>
                    <p class="fg-2 mb-0">Bone / Relaxed Fit</p>
                    <p class="fg-2">XS-2XL</p>
                    <p>Plain, comfortable tee designed for everyday wear.</p>

                    <div class="d-flex justify-content-between align-items-end mb-6">
                        <div>
                            <label for="product-size" class="form-label mb-0">Size:</label>

                            <select id="product-size" class="form-control w-auto">
                                <option value="XS">XS</option>
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                                <option value="2XL">2XL</option>
                            </select>
                        </div>

                        <div>
                            <label for="product-quantity" class="form-label mb-0">Quantity:</label>
                            <div class="input-group" style="max-width: 130px;">
                                <button class="btn btn-outline-secondary" type="button" onclick="updateQty(-1)">&minus;</button>
                                <input type="number" id="product-quantity" class="form-control text-center" style="width: 50px; flex: 0 0 50px;" value="1" min="1" readonly>
                                <button class="btn btn-outline-secondary" type="button" onclick="updateQty(1)">&plus;</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-center">
                        <button id="order-btn" type="button" class="btn-solid theme-primary">Order Now</button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="bg-1 border-top py-7 mt-auto" id="contact">
            <div class="container d-flex flex-column md:flex-row md:justify-content-between gap-2 text-center">
                <span class="fg-2">OFF/HOURS &copy; 2026</span>
                <div class="d-flex justify-content-center gap-6">
                    <a href="privacy.html" class="text-decoration-none">Privacy</a>
                    <a href="terms.html" class="text-decoration-none">Terms</a>
                </div>
            </div>
        </footer>

        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
        <script src="./js/script.js"></script>
    </body>
</html>
